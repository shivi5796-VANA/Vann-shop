--hf:'Poppins','Mukta',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--bf:'Mukta',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--hi:'Mukta',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f1a15;--card:#16241d;--soft:#1b2d24;--peach:#2a2219;--sky:#18262c;--ink:#e8f0ea;--muted:#9db0a4;--line:#26382e;--brand:#8fd6aa;--chip:#1d2c24;--shadow:0 6px 24px rgba(0,0,0,.35)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1a15;--card:#16241d;--soft:#1b2d24;--peach:#2a2219;--sky:#18262c;--ink:#e8f0ea;--muted:#9db0a4;--line:#26382e;--brand:#8fd6aa;--chip:#1d2c24;--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--bf);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
h1,h2,h3{font-family:var(--hf);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px;font-family:var(--bf);font-weight:800;letter-spacing:0}
p{margin:0}
.ic{width:22px;height:22px;flex:none}
:focus-visible{outline:3px solid var(--mari);outline-offset:2px}

/* frame */
#phone{position:relative;width:min(100%,440px);margin:0 auto;min-height:100dvh;background:var(--bg);padding-bottom:96px}
.side{display:none}
@media (min-width:900px){
 body{background:#1B5E20}
 #phone{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.35)}
 .side{display:block;position:fixed;left:max(24px,calc(50% - 560px));top:48px;width:260px;color:#e7f2ea}
 .side h2{font-size:28px;margin:14px 0 10px;color:#fff}.side p{font-size:15px;opacity:.85;margin-bottom:10px}
}
#app{min-height:calc(100dvh - 96px)}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid transparent}
.hdr.sc{border-bottom-color:var(--line)}
.hdr .t{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;flex:1}
.brand b{font-family:var(--hf);font-size:24px;font-weight:600;color:var(--brand)}
.mark{width:34px;height:34px;border-radius:11px;background:var(--fill);display:grid;place-items:center}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;position:relative;background:var(--chip)}
.ib .n[hidden]{display:none}.ib .n{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--terra);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.search{display:flex;align-items:center;gap:8px;margin:0 16px;padding:0 14px;height:48px;border-radius:14px;background:var(--chip);color:var(--muted);width:calc(100% - 32px);text-align:left}
.search input{border:0;background:none;outline:0;flex:1;height:100%;font-size:16px;color:var(--ink)}

/* layout bits */
.pad{padding:0 16px}.mt{margin-top:22px}.mt2{margin-top:12px}.mt3{margin-top:32px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 16px;margin:28px 0 12px}
.sec a,.link{color:var(--brand);font-weight:800;font-size:14px;text-decoration:none;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:13px}.b{font-weight:800}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 6px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}.scroll>*{flex:none;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}
.note{font-size:13px;color:var(--muted);padding:0 16px}

/* hero */
.hero{margin:12px 16px 0;border-radius:24px;background:var(--fill);color:#fff;overflow:hidden;position:relative}
.hero .art{display:block;width:100%;height:auto;margin-top:-8px}
.hero .tx{padding:20px 20px 0}
.hero h1{font-size:30px;color:#fff}
.hero p{opacity:.9;margin-top:8px;font-size:15px}
.hero .cta{display:flex;gap:10px;padding:0 20px 20px;margin-top:-6px;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--ink);color:var(--cream);font-weight:800;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.alt{background:var(--mari);color:#2a1a00}.btn.ghost{background:var(--chip);color:var(--ink)}.btn.line{background:none;border:2px solid var(--line);color:var(--ink)}
.btn.w{width:100%}.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn:not(.alt):not(.ghost):not(.line):not(.wa){background:var(--leaf2);color:var(--cream)}}
:root[data-theme=dark] .btn:not(.alt):not(.ghost):not(.line):not(.wa){background:var(--leaf2);color:var(--cream)}

/* category bubbles */
.cat{width:78px;text-align:center;font-size:12.5px;font-weight:700;line-height:1.2}
.cat .bub{width:72px;height:72px;margin:0 auto 6px;border-radius:50%;background:var(--soft);overflow:hidden;display:grid;place-items:end center}
.cat .bub svg{width:64px;height:84px;margin-bottom:-12px}

/* product card */
.pc{background:var(--card);border-radius:18px;position:relative;display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);overflow:hidden}
.pc .im{background:var(--soft);aspect-ratio:1/1.02;display:grid;place-items:end center;overflow:hidden}
.pc .im.o{background:var(--peach)}.pc .im.s{background:var(--sky)}
.pc .im svg{width:92%;height:auto;margin-bottom:-4%}
.pc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.pc .nm{font-weight:800;font-size:14.5px;line-height:1.25}
.pc .hi{font-size:12.5px;color:var(--muted)}
.pc .tg{font-size:12px;color:var(--brand);font-weight:700;margin-top:2px}
.pc .pr{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;font-weight:800;white-space:nowrap}
.add{width:36px;height:36px;border-radius:11px;background:var(--fill);color:#fff;display:grid;place-items:center}
.add .ic{width:20px;height:20px}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;color:#5b6b62;z-index:2}
.heart.on{color:var(--terra)}.heart.on svg path{fill:currentColor}
.scroll .pc{width:158px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:19px;background:var(--chip);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid transparent}
.chip.on{background:var(--fill);color:#fff}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.opt{min-height:44px;padding:8px 14px;border-radius:14px;background:var(--chip);font-weight:700;font-size:14px;border:2px solid transparent;text-align:left;display:inline-flex;align-items:center;gap:8px}
.opt.on{border-color:var(--leaf3);background:var(--soft);color:var(--brand)}

/* segmented */
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin:0 16px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* banners & cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.band{margin:0 16px;border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center}
.band.g{background:var(--soft)}.band.p{background:var(--peach)}.band.m{background:#fff3d9;color:#2a1a00}
.band .bx{width:88px;flex:none}.band .bx svg{width:100%;height:auto}
.band h3{font-size:16px}.band p{font-size:14px;color:var(--muted);margin-top:4px}
.band.m p{color:#6b5320}

/* pins (masonry) */
.mason{columns:2;column-gap:12px;padding:0 16px}
.pin{break-inside:avoid;margin-bottom:12px;display:block;width:100%;text-align:left;position:relative}
.pin .ps{border-radius:16px;overflow:hidden;display:block}.pin .ps svg{display:block;width:100%;height:auto}
.pin .pt{font-weight:800;font-size:13.5px;line-height:1.3;margin-top:6px}
.pin .pm{font-size:12px;color:var(--muted);margin-top:2px}

/* nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);min-height:52px;justify-content:center}
#nav button.on{color:var(--brand)}
#nav .scan{transform:translateY(-14px)}
#nav .scan span.c{width:58px;height:58px;border-radius:20px;background:var(--fill);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(27,90,60,.4);border:4px solid var(--card)}
#nav .scan.on{color:var(--brand)}
#fb{position:fixed;top:46%;right:max(0px,calc(50% - 220px));z-index:31;background:var(--mari);color:#2a1a00;border-radius:12px 0 0 12px;padding:12px 7px;font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:6px;box-shadow:-2px 4px 14px rgba(0,0,0,.16);writing-mode:vertical-rl}
#fb .ic{width:16px;height:16px;transform:rotate(90deg)}

/* detail */
.pdart{background:var(--soft);margin:0 16px;border-radius:24px;display:grid;place-items:end center;position:relative;overflow:hidden;min-height:300px}
.pdart.o{background:var(--peach)}.pdart.s{background:var(--sky)}
.pdart svg.main{width:min(78%,300px);height:auto;margin-bottom:-6px}
.pd h1{font-size:28px}
.sci{font-style:italic;color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px}
.fact{background:var(--chip);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.fact .ic{color:var(--brand)}.fact small{display:block;color:var(--muted);font-size:12px}.fact b{font-size:14px;display:block;line-height:1.25}
.potpick{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none}.potpick::-webkit-scrollbar{display:none}
.pp{flex:none;width:84px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:4px 4px 8px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.2}
.pp svg{width:100%;height:70px}.pp.on{border-color:var(--leaf3);background:var(--soft)}
.pp i{display:block;font-style:normal;color:var(--muted);font-weight:600;margin-top:2px}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px}
.sz{border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-weight:800;font-size:14px;line-height:1.2}
.sz small{display:block;font-weight:600;color:var(--muted);font-size:11.5px;margin-top:2px}
.sz.on{border-color:var(--leaf3);background:var(--soft)}
.buybar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:32}
.buybar .tot{flex:1;line-height:1.15}.buybar .tot b{font-size:20px;display:block;white-space:nowrap}.buybar .tot small{color:var(--muted);font-size:12px}
ul.tips{margin:0;padding:0 16px 0 34px}ul.tips li{margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;padding:0 16px}
.cal div{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal span{display:block;height:28px;border-radius:6px;background:var(--chip);margin-bottom:4px}
.cal .on span{background:var(--leaf3)}.cal .now{color:var(--ink)}.cal .now span{outline:2px solid var(--mari);outline-offset:1px}

/* list rows */
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li .th{width:64px;height:64px;border-radius:14px;background:var(--soft);flex:none;display:grid;place-items:end center;overflow:hidden}
.li .th svg{width:58px;height:75px;margin-bottom:-6px}
.li .th.s{background:var(--sky)}.li .th.o{background:var(--peach)}
.li .mid{flex:1}.li .mid b{display:block;font-size:15px;line-height:1.25}.li .mid small{color:var(--muted);font-size:13px;display:block}
.qty{display:flex;align-items:center;gap:2px;background:var(--chip);border-radius:12px}
.qty button{width:36px;height:36px;display:grid;place-items:center}.qty span{min-width:20px;text-align:center;font-weight:800}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px}
.tile .ic{color:var(--brand);width:26px;height:26px}.tile b{font-size:15px;line-height:1.2}.tile small{color:var(--muted);font-size:12.5px;line-height:1.3}

/* forms */
.fld{display:block;padding:0 16px;margin-top:12px}
.fld span{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.inp{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 12px;font-size:16px;outline:0}
.inp:focus{border-color:var(--leaf3)}
textarea.inp{min-height:96px;resize:vertical}
.sumr{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}.sumr.t{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}

/* scan */
.scanhero{margin:8px 16px 0;border-radius:24px;background:linear-gradient(160deg,#1B5E20,#2E7D32);color:#fff;padding:20px;position:relative;overflow:hidden}
.scanhero h1{color:#fff;font-size:28px}.scanhero p{opacity:.9;margin-top:6px}
.steps3{display:grid;gap:10px;margin-top:16px}
.steps3 div{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700}
.steps3 i{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-style:normal;flex:none}
.samples{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 16px}
.samples button{text-align:center;font-size:12px;font-weight:700}
.samples .ps{display:block;border-radius:12px;overflow:hidden;aspect-ratio:3/4;margin-bottom:4px}.samples svg{width:100%;height:100%;object-fit:cover}
.photo{margin:0 16px;border-radius:20px;overflow:hidden;position:relative;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.photo>img{display:block;width:100%;height:auto;pointer-events:none}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--mari);box-shadow:0 0 18px 6px rgba(249,200,74,.6);animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{from{top:4%}to{top:94%}}
.photo .lbl{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:800;padding:6px 10px;border-radius:10px}
.pvi{position:absolute;transform:translate(-50%,-100%);touch-action:none;cursor:grab}
.pvi svg{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.pvi.sel{outline:2px dashed #fff;outline-offset:2px;border-radius:6px}
.pvi.hang{transform:translate(-50%,0)}
video.live{display:block;width:100%;height:auto;background:#000}
.match{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:6px}.match i{display:block;height:100%;background:var(--leaf3);border-radius:3px}
.rec{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:18px;margin:0 16px 12px;background:var(--card)}
.rec .ra{width:96px;height:130px;align-self:flex-start;flex:none;background:var(--soft);border-radius:14px;display:grid;place-items:end center;overflow:hidden}
.rec .ra svg{width:92px;height:120px;margin-bottom:-6px}
.rec ul{margin:6px 0 0;padding-left:18px;font-size:13px}.rec li{margin:2px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--brand);font-weight:800;font-size:12.5px;padding:5px 10px;border-radius:999px}
.pill.w{background:#fff3d9;color:#6b4a00}

/* sheet & toast */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(10,20,15,.5)}
.sheet .panel{position:relative;width:min(100%,440px);max-height:92dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 0 calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:#14211a;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:min(92vw,400px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;padding:40px 24px;color:var(--muted)}
.empty svg{width:120px;height:auto}
.rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:0 16px}
.rate button{min-height:56px;border-radius:14px;background:var(--chip);font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid transparent;line-height:1.1}
.rate button i{width:14px;height:14px;border-radius:50%;display:block}
.rate button.on{border-color:var(--leaf3);background:var(--soft)}
.nps{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;padding:0 16px}
.nps button{min-height:40px;border-radius:10px;background:var(--chip);font-weight:800;font-size:13px;border:2px solid transparent}
.nps button.on{background:var(--fill);color:#fff}
pre.out{white-space:pre-wrap;background:var(--chip);border-radius:14px;padding:14px;margin:0 16px;font:13px/1.45 ui-monospace,Menlo,monospace;max-height:240px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.fbb{background:var(--mari);color:#2a1a00}.fbb.pill2{width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;font-weight:800;font-size:13px}.fbb .ic{width:19px;height:19px}
.pc .hi.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.hdr{padding-top:calc(12px + env(safe-area-inset-top))}
.pdtools{position:absolute;top:12px;right:12px;display:grid;gap:8px;z-index:2}.pdtools .ib{background:rgba(255,255,255,.9);color:#14211a}
.pdart.hasph{aspect-ratio:1/1}.pdart img.ph.big{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pdview{position:absolute;left:12px;bottom:12px;display:flex;background:rgba(255,255,255,.92);border-radius:12px;padding:3px;z-index:2}.pdview button{min-height:34px;padding:0 12px;border-radius:9px;font-weight:800;font-size:13px;color:#5b6b62}.pdview button.on{background:#1B5E20;color:#fff}
.pc .im img.ph{width:100%;height:100%;object-fit:cover;display:block}.li .th img.ph{width:100%;height:100%;object-fit:cover}
.kitc{width:240px}.scroll .pc.kitc{width:240px}.kitc .im{background:var(--soft)}.kitc .im svg{width:100%;height:auto;margin:0}
.giftcard{margin:14px 16px 0;border-radius:18px;background:#fff8ec;border:1.5px dashed #e0b765;padding:18px 120px 18px 18px;position:relative;overflow:hidden;color:#3a2a10;min-height:150px}
.gc-top{font-family:var(--hf);font-size:24px;font-weight:600;color:#8a3f23}.gc-msg{margin-top:8px;font-size:15px;font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}.gc-from{margin-top:10px;font-weight:800;font-size:14px}
.gc-art{position:absolute;right:6px;bottom:-8px;width:110px}.gc-art svg{width:100%;height:auto}
ol.tl{list-style:none;margin:16px 0 8px;padding:0 16px}.tl li{display:flex;gap:12px;position:relative;padding-bottom:18px}.tl li:not(:last-child)::before{content:'';position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line)}.tl li.done:not(:last-child)::before{background:var(--leaf3)}
.tl i{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--chip);border:2px solid var(--line)}.tl li.done i{background:var(--leaf3);border-color:var(--leaf3);color:#fff}.tl li.now i{box-shadow:0 0 0 5px rgba(46,125,50,.2)}.tl i .ic{width:16px;height:16px}
.tl b{display:block;font-size:15px}.tl small{color:var(--muted);font-size:13px}

.pmode{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.pmode button{border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:grid;gap:2px;background:var(--card)}
.pmode button b{font-size:15px}.pmode button small{color:var(--muted);font-size:12.5px}.pmode button em{font-style:normal;font-weight:800;margin-top:4px}
.pmode button.on{border-color:var(--leaf3);background:var(--soft)}
.potchoice{display:grid;gap:12px;padding:16px 16px 0}
.pcopt{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;text-align:left;background:var(--card)}
.pcopt:active,.pcopt:hover{border-color:var(--leaf3)}
.pcopt .art{width:104px;flex:none;background:var(--soft);border-radius:14px;display:grid;place-items:end center;overflow:hidden;aspect-ratio:3/2}.pcopt .art svg{width:100%;height:auto}
.pcopt .tx{display:grid;gap:2px}.pcopt b{font-size:16px}.pcopt small{color:var(--muted);font-size:13px}.pcopt em{font-style:normal;font-weight:800;font-size:17px;margin-top:4px}.pcopt em s{font-weight:600;font-size:13px;color:var(--muted)}

#phone{padding-bottom:calc(96px + var(--bz,0px))}
#nav{bottom:var(--bz,0px)}#nav::after{content:'';position:absolute;left:-1px;right:-1px;top:100%;height:var(--bz,0px);background:var(--card)}
.buybar{bottom:var(--bz,0px)}.buybar::after{content:'';position:absolute;left:0;right:0;top:100%;height:var(--bz,0px);background:var(--card)}
#toast{bottom:calc(150px + var(--bz,0px))}
.sheet .panel{padding-bottom:calc(24px + env(safe-area-inset-bottom) + var(--bz,0px))}
/* customer support */
.btn.wa{background:#177a43;color:#fff}.btn.wa .ic{width:20px;height:20px}
.supc{background:linear-gradient(160deg,var(--soft),var(--card) 70%)}
.sth{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex:none}
.tipc{display:flex;gap:10px;align-items:flex-start;margin:12px 16px 0;background:var(--soft);border-color:transparent;padding:12px 14px}.tipc>.ic{flex:none;color:var(--brand);margin-top:1px}
.okc{background:#e6f4ea;border-color:#bfe0c9}
.faq{padding:0 16px;display:grid;gap:8px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.faq summary{min-height:50px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14.5px;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';margin-left:auto;font-size:22px;font-weight:600;color:var(--muted)}
.faq details[open] summary::after{content:'\2013'}
.faq p{font-size:14px;color:var(--muted);padding:0 0 14px;line-height:1.5}
.tkph{width:100%;max-height:240px;object-fit:cover;border-radius:12px;display:block}
.tkpw{position:relative}.tkpw .ib{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);color:#14211a}
.link .ic{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
@media (prefers-color-scheme:dark){:root[data-theme=dark] .okc{background:#16301f;border-color:#24503a}}
.brand{min-width:0}.brand b{white-space:nowrap}.mark{flex:none}
.hdr .hlp{flex:none}
@media (max-width:400px){.brand b{font-size:21px}.hdr{gap:8px}.fbb.pill2{padding:0 10px}}
@media (max-width:370px){.hdr .hlp{width:40px}.brand{gap:6px}.brand b{font-size:19px}}

/* Vann brand: logo, opening screen, Hindi tagline */
.brand .logo{display:flex;align-items:center;gap:8px;height:44px}.brand .logo img{display:block;height:44px;width:auto}
.brand .logo .wm{font-family:'Poppins','Mukta',sans-serif;font-weight:700;font-size:24px;line-height:1;color:var(--brand);letter-spacing:-.01em}
@media (min-width:900px){.brand .logo,.brand .logo img{height:52px}.brand .logo .wm{font-size:27px}}
.appic{flex:none;border-radius:12px;display:block}
#splash{position:fixed;inset:0;z-index:2147483000;background:#FAF7F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;opacity:1;transition:opacity .45s ease;cursor:pointer}
#splash[hidden]{display:none}#splash.out{opacity:0;pointer-events:none}
#splash .em{position:relative;width:260px;max-width:72vw;aspect-ratio:1}
#splash .em img,#splash .em .ld,#splash .em .sc{position:absolute;inset:0;width:100%;height:100%;display:block;animation-duration:7.5s;animation-fill-mode:both;animation-timing-function:linear}
#splash .em .sc{clip-path:inset(0 0 38% 0);animation:none}
#splash .em .ld{animation-name:spLand;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,transparent 49.25%,#000 50.75%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,transparent 49.25%,#000 50.75%,#000 100%);-webkit-mask-size:100% 200%;mask-size:100% 200%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#splash .em .ld img{animation-name:none}
#splash .em .sky{animation-name:spSky}
#splash .em .rays{animation-name:spRays;transform-origin:51.9% 62.9%}
#splash .em .sun{animation-name:spSun}
#splash .em .ld img.roots{animation-name:spRoots}
#splash .em .txt{animation-name:spText}
#splash .em .plant{animation-name:spPlant;transform-origin:30.2% 57.8%}
@keyframes spSky{0%,4%{opacity:0;animation-timing-function:cubic-bezier(.45,0,.4,1)}52%,100%{opacity:1}}
@keyframes spLand{0%,2%{-webkit-mask-position:0 0%;mask-position:0 0%;animation-timing-function:cubic-bezier(.3,.5,.4,1)}16%,100%{-webkit-mask-position:0 46%;mask-position:0 46%}}
@keyframes spRoots{0%,10%{clip-path:circle(0% at 46.7% 74.4%);animation-timing-function:cubic-bezier(.3,.3,.4,1)}50%,100%{clip-path:circle(42% at 46.7% 74.4%)}}
@keyframes spSun{0%,10%{transform:translateY(18%);animation-timing-function:cubic-bezier(.3,.3,.4,1)}50%,100%{transform:translateY(0)}}
@keyframes spText{0%,6%{clip-path:polygon(0% 77%,100% 92%,100% 120%,0% 120%);animation-timing-function:cubic-bezier(.35,.2,.45,1)}22%,100%{clip-path:polygon(0% 30%,100% 50%,100% 120%,0% 120%)}}
@keyframes spPlant{0%,22%{clip-path:inset(58% 0 0 0);transform:scale(.86);animation-timing-function:cubic-bezier(.3,.4,.3,1)}66%,100%{clip-path:inset(0 0 0 0);transform:scale(1)}}
@keyframes spRays{0%,38%{opacity:0;transform:scale(.7) rotate(-8deg);animation-timing-function:cubic-bezier(.25,.6,.3,1)}64%,100%{opacity:1;transform:scale(1) rotate(0deg)}}
#splash .sp-hi,#splash .sp-en{animation:spFade .9s ease-out 3.6s both}
@keyframes spFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#splash .sp-hi{font-family:'Mukta',sans-serif;font-weight:600;font-size:22px;line-height:1.5;color:#1B5E20;margin:14px 0 0}
#splash .sp-en{font-family:'Poppins','Mukta',sans-serif;font-size:14px;color:#56625A;margin:0}
.tag-hi{padding:2px 16px 6px}.tag-hi p{font-family:var(--hi);font-size:20px;line-height:1.5;color:var(--brand);margin:0}.tag-hi small{display:block;font-size:13px;color:var(--muted)}
.tag-hi.c{padding:10px 0 0}.tag-hi.g{padding-top:8px}
/* 360° pot turntable */
.pdart .spin{align-self:center;width:100%;display:grid;place-items:center;padding:52px 0 54px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.pdart .spin:active{cursor:grabbing}
.pdart .spin svg.main{width:min(74%,290px);margin:0}
.spinbar{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.92);border-radius:12px;padding:3px;z-index:2;color:#24322a;font-size:12.5px;font-weight:700}
.spinbar button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}.spinbar button .ic{width:18px;height:18px}.spinbar span{padding:0 4px}
.pdview button .ic{width:15px;height:15px;vertical-align:-3px;margin-right:3px}
/* stock from the host app */
.pc{position:relative}.pc.so .im{opacity:.5}.pc .sold{position:absolute;top:10px;left:10px;z-index:2;background:#24322a;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px}

/* DIY & gift ideas, profile */
.idc{flex:none;width:168px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.idc .ia{background:var(--soft);aspect-ratio:1/1;display:grid;place-items:end center;padding:8px 14px 0}.idc .ia svg{width:82%;height:auto;display:block}
.idc .it{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}.idc b{font-size:15px;line-height:1.2}.idc small{color:var(--muted);font-size:12.5px}
.idc .hi,.hiline{font-family:var(--hi);font-weight:600;color:var(--brand)}.idc .hi{font-size:13px}.hiline{font-size:18px}
.idgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}.idgrid .idc{width:auto}
.need{list-style:none;padding:0 16px;margin:0;display:grid;gap:10px}.need li{display:flex;gap:10px;align-items:flex-start}.need li .ic{color:var(--leaf);width:20px;height:20px;margin-top:2px}
.steps{counter-reset:st;list-style:none;padding:0 16px;margin:0;display:grid;gap:12px}.steps li{counter-increment:st;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(st);width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--brand);font-weight:800;display:grid;place-items:center}
.dt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;gap:0 8px;padding:0 16px 8px;align-items:end;border-bottom:1px solid var(--line);margin-bottom:8px}
.dt .fld{padding:0}.dt .dd{grid-column:1/3}.dt .ib{margin-bottom:6px}
</style>

const bgc=(k,id)=>k==='plant'?(PL[id].w==='out'?'o':''):k==='seed'?'o':k==='care'||k==='pot'?'s':'';

function pcard(k,id){const it=KIND[k][id];let sub='',tg='',price=it.pr;
  if(k==='plant'){sub=it.h;tg=cardTag(it)}else if(k==='pot'){sub=it.m;tg=it.p.map(x=>SPOTS[x].split(' ')[0]).slice(0,2).join(' · ')}else if(k==='seed'){sub=it.h;tg=it.sow.includes(MON)?'Sow now':'Sow in '+it.sow.map(m=>MONTHS[m-1]).slice(0,2).join(', ')}else{sub=it.d}
  const so=avail(k,id)===0;
  return`<div class="pc${so?' so':''}">${so?'<span class="sold">Out of stock</span>':''}<button class="heart${wished(k,id)?' on':''}" data-a="wish" data-k="${k}" data-id="${id}" aria-label="Save to wishlist">${I('heart')}</button><button class="im ${bgc(k,id)}" data-a="open" data-k="${k}" data-id="${id}" aria-label="${esc(it.n)}" style="display:grid;width:100%">${PH[id]?phImg(id):thumb(k,id,k==='plant'?it.dp:null)}</button><div class="bd"><button class="nm" data-a="open" data-k="${k}" data-id="${id}" style="text-align:left">${esc(it.n)}</button>${sub?`<div class="hi${k==='care'?' clamp':''}">${esc(sub)}</div>`:''}<div class="tg">${esc(tg)}</div><div class="pr"><span>${k==='plant'?'from ':''}${rs(price)}</span><button class="add" data-a="quick" data-k="${k}" data-id="${id}" aria-label="Add ${esc(it.n)} to cart">${I('plus')}</button></div></div></div>`}

  <div class="sec"><h2>DIY & gift ideas</h2><a href="#" data-a="go" data-v="diy">See all</a></div>
  <div class="scroll">${map(IDEAS,ideaCard)}</div>
  <div class="mt"></div><button class="band p" data-a="go" data-v="gift" style="width:calc(100% - 32px);text-align:left"><div class="bx">${Art.plant('anthurium','white')}</div><div><h3>Gift a plant</h3><p>Griha Pravesh, birthdays, Diwali, Rakhi — with a handwritten card and no prices inside.</p></div></button>

function shopItems(){const s=R.shop,q=s.q.trim().toLowerCase();let arr;
  if(s.seg==='plants'){arr=PLANTS.filter(p=>s.f==='all'||(s.f==='in'?p.w!=='out':s.f==='out'?p.w!=='in':s.f==='pet'?p.pet:s.f==='vastu'?isVastu(p):p.t.includes(s.f)))}
  else if(s.seg==='pots'){arr=POTS.filter(p=>s.f==='all'||(s.f==='indoor'?p.p.some(x=>['floor','table'].includes(x)):s.f==='outdoor'?p.p.some(x=>['ground','railing','window'].includes(x)):p.p.some(x=>['hanging','wall'].includes(x))))}
  else if(s.seg==='seeds'){arr=SEEDS.filter(p=>s.f==='all'||(s.f==='now'?p.sow.includes(MON):p.ty===s.f))}
  else arr=CARE.slice();
  if(q)arr=arr.filter(p=>(p.n+' '+(p.h||'')+' '+(p.sci||'')+' '+(p.al||'')+' '+(p.m||'')).toLowerCase().includes(q));
  if(s.sort==='low')arr.sort((a,b)=>a.pr-b.pr);if(s.sort==='high')arr.sort((a,b)=>b.pr-a.pr);if(s.sort==='name')arr.sort((a,b)=>a.n.localeCompare(b.n));return arr}

const FILTERS={plants:[['all','All'],['in','Indoor'],['out','Outdoor'],['low','Low light'],['air','Air purifying'],['pet','Pet-friendly'],['flower','Flowering'],['herb','Herbs & kitchen'],['med','Medicinal'],['succ','Succulents'],['vastu','Vastu'],['easy','Beginner'],['fragrant','Fragrant'],['fruit','Fruiting'],['big','Statement'],['hang','Hanging']],pots:[['all','All'],['indoor','Indoor'],['outdoor','Balcony & terrace'],['hang','Hanging & wall']],seeds:[['all','All'],['now','Sow now'],['Vegetable','Vegetables'],['Flower','Flowers'],['Herb','Herbs']],care:[]};
const gridHTML=()=>{const a=shopItems(),k=SEGK[R.shop.seg];return(R.shop.seg==='plants'&&R.shop.f==='vastu'?vastuBand():'')+`<p class="note" style="margin-bottom:10px">${a.length} ${R.shop.seg==='care'?'products':R.shop.seg}</p>`+(a.length?`<div class="grid">${map(a,p=>pcard(k,p.id))}</div>`:`<div class="empty">Nothing matches that. Try another filter.</div>`)};
V.shop=()=>{const s=R.shop;return hdrTitle('Shop')+`<label class="search" style="margin-bottom:12px">${I('search')}<input id="shopq" type="search" placeholder="Search in ${s.seg==='care'?'care & tools':s.seg}" value="${esc(s.q)}" aria-label="Search"></label>
  <div class="seg">${map([['plants','Plants'],['pots','Pots'],['seeds','Seeds'],['care','Care & tools']],([k,n])=>`<button class="${s.seg===k?'on':''}" data-a="seg" data-s="${k}">${n}</button>`)}</div>
  ${FILTERS[s.seg].length?`<div class="chips mt2">${map(FILTERS[s.seg],([k,n])=>`<button class="chip${s.f===k?' on':''}" data-a="filt" data-f="${k}">${n}</button>`)}</div>`:''}
  <div class="row pad mt2"><span class="sp"></span><label class="small muted" for="sort">Sort</label><select id="sort" class="inp" style="width:auto;min-height:40px;padding:6px 10px">${map([['pop','Popular'],['low','Price: low to high'],['high','Price: high to low'],['name','Name']],([k,n])=>`<option value="${k}"${s.sort===k?' selected':''}>${n}</option>`)}</select></div>
  <div id="grid" class="mt2">${gridHTML()}</div>`};
AFTER.shop=()=>{const q=$('#shopq');q.oninput=()=>{R.shop.q=q.value;$('#grid').innerHTML=gridHTML()};$('#sort').onchange=e=>{R.shop.sort=e.target.value;$('#grid').innerHTML=gridHTML()}};

/* product */
function potChoices(p){const fit=POTS.filter(o=>o.p.some(x=>p.p.includes(x)||(x==='floor'&&p.p.includes('ground'))||(x==='ground'&&p.p.includes('floor')))).map(o=>o.id);const rest=POTS.map(o=>o.id).filter(id=>!fit.includes(id));const first=[p.dp,...fit.filter(i=>i!==p.dp)];return['none',...first,...rest]}
/* ---------- 360° pot view ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
function spinBox(id){return`<div class="spin" data-pot="${id}" role="img" aria-label="${esc(PO[id].n)}, 360 degree view">${Art.potSpin(id,R.spinDeg||0,{cls:'main'})}</div><div class="spinbar"><button data-a="spinby" data-d="-45" aria-label="Turn left">${I('back')}</button><span>Drag to turn</span><button data-a="spinby" data-d="45" aria-label="Turn right" style="transform:scaleX(-1)">${I('back')}</button></div>`}
function drawSpin(root){root.querySelectorAll('.spin').forEach(el=>{el.innerHTML=Art.potSpin(el.dataset.pot,R.spinDeg||0,{cls:'main'})})}
function bindSpin(root){const el=root.querySelector('.spin');if(!el||el.dataset.bound)return;el.dataset.bound=1;let drag=null,idle=0;
  el.addEventListener('pointerdown',e=>{drag={x:e.clientX,d:R.spinDeg||0};idle=Date.now();try{el.setPointerCapture(e.pointerId)}catch(x){}});
  el.addEventListener('pointermove',e=>{if(!drag)return;R.spinDeg=drag.d+(e.clientX-drag.x)*1.4;drawSpin(root)});
  const end=()=>{drag=null;idle=Date.now()};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  if(S.anim&&!RM.matches){clearInterval(R.spinTimer);R.spinTimer=setInterval(()=>{if(!document.body.contains(el)){clearInterval(R.spinTimer);return}if(drag||Date.now()-idle<2500||document.hidden)return;R.spinDeg=(R.spinDeg||0)+3;drawSpin(root)},70)}}
AFTER.product=()=>bindSpin($('#app'));
V.product=c=>{const k=c.k,id=c.id,it=KIND[k][id];
  if(!R.prod||R.prod.k!==k||R.prod.id!==id)R.prod={k,id,size:'S',pot:k==='plant'?(c.pot||it.dp):null,pin:S.pin||''};
  const P=R.prod;let art,body='',total=0,sub='';
  const tools=`<div class="pdtools"><button class="ib" data-a="wish" data-k="${k}" data-id="${id}" aria-label="Save" style="color:${wished(k,id)?'var(--terra)':'inherit'}">${I('heart')}</button><button class="ib" data-a="shareprod" aria-label="Share">${I('share')}</button></div>`;
  const hasPh=!!PH[id],showPh=hasPh&&P.view!=='art';
  const sizes=(pf)=>`<div class="sec"><h3>Size</h3></div><div class="sizes">${map(SIZES,s=>`<button class="sz${P.size===s.k?' on':''}" data-a="size" data-s="${s.k}">${s.n}<small>${s.d}</small><small>${rs(pf(s.k))}</small></button>`)}</div>`;
  const deliv=`<div class="sec"><h3>Delivery</h3></div><div class="row pad"><input id="pinc" class="inp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit pincode" value="${esc(P.pin)}" style="flex:1"><button class="btn ghost sm" data-a="pincheck">Check</button></div><p id="pinr" class="note mt2">${P.pin&&eta(P.pin)?esc(eta(P.pin).txt):'Free delivery above ₹499 · plant-safe packaging'}</p>`;
  if(k==='plant'){const pot=P.pot;art=showPh?phImg(id,'ph big'):Art.plant(id,pot==='none'?'nursery':pot,{cls:'main'});total=plantPrice(id,P.size)+potPrice(pot,P.size);sub=pot==='none'?'Plant in nursery pot':`Plant ${rs(plantPrice(id,P.size))} + pot ${rs(potPrice(pot,P.size))}`;
    const fitsPot=pot==='none'||PO[pot].p.some(x=>it.p.includes(x)||(x==='floor'&&it.p.includes('ground')));
    body=`<div class="pad mt pd"><h1>${esc(it.n)}</h1><p class="sci">${esc(it.h)} · ${esc(it.sci)}</p><div class="row mt2" style="flex-wrap:wrap;gap:6px">${map(it.t.filter(t=>t!=='hang'),t=>`<span class="pill">${TAGS[t]}</span>`)}${it.pet?`<span class="pill">Pet-friendly</span>`:''}</div><p class="mt2">${esc(it.s)}</p></div>
    <div class="facts mt">${[['sun','Light',lightTxt(it)],['drop','Water',`${it.wt} · ${WATER[it.wt].toLowerCase()}`],['leaf','Care level',it.d],['paw','Pets',it.pet?'Pet-friendly':'Keep away from pets']].map(([ic,l,v])=>`<div class="fact">${I(ic)}<div><small>${l}</small><b>${esc(v)}</b></div></div>`).join('')}</div>
    ${sizes(s=>plantPrice(id,s)+potPrice(pot,s))}
    <div class="sec"><h3>How do you want it?</h3></div>
    <div class="pmode"><button class="${pot==='none'?'on':''}" data-a="potmode" data-w="0"><b>Plant only</b><small>In a nursery pot</small><em>${rs(plantPrice(id,P.size))}</em></button><button class="${pot!=='none'?'on':''}" data-a="potmode" data-w="1"><b>Plant + pot</b><small>Planted, ready to place</small><em>${rs(plantPrice(id,P.size)+potPrice(pot==='none'?(P.lastPot||it.dp):pot,P.size))}</em></button></div>
    ${pot==='none'?'':`<div class="sec"><h3>Choose a pot</h3>${Art.SPIN.includes(pot)?`<button class="link" data-a="spinsheet" data-p="${pot}">${I('refresh')}See ${esc(PO[pot].n.replace(' Planter','').replace(' Pot',''))} in 360°</button>`:`<span class="small muted">${esc(PO[pot].n)}</span>`}</div>
    <div class="potpick">${map(potChoices(it).filter(o=>o!=='none'),o=>`<button class="pp${pot===o?' on':''}" data-a="ppot" data-p="${o}">${Art.potOnly(o)}${esc(PO[o].n.replace(' Planter','').replace(' Pot',''))}<i>+${rs(potPrice(o,P.size))}</i></button>`)}</div>
    ${fitsPot?'':`<p class="note mt2">Tip: this pot works, but ${it.n.split(' (')[0]} looks best ${it.p.slice(0,2).map(x=>SPOTS[x].toLowerCase()).join(' or ')}.</p>`}`}
    <div class="pad mt" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn line" data-a="tryin" data-id="${id}">${I('scan')}In my space</button><button class="btn line" data-a="giftprod">${I('gift')}Send as gift</button></div>
    <div class="sec"><h3>Where it's happiest</h3></div><div class="chips wrap">${map(it.p,x=>`<span class="chip">${SPOTS[x]}</span>`)}<span class="chip">${it.cl==='humid'?'Loves humidity':it.cl==='dry'?'Handles dry heat':'Grows across India'}</span></div>
    ${vastuSection(it)}
     <div class="sec"><h3>Care tips</h3></div>${TAG_HI()}<ul class="tips">${map(it.care,t=>`<li>${esc(t)}</li>`)}<li>Best time to plant: ${esc(it.ss)}</li></ul>
    ${deliv}
    <div class="pad mt2"><button class="link" style="white-space:normal;text-align:left" data-a="raise" data-t="care" data-pid="${id}">${I('chat')}Questions about this plant? Ask us on WhatsApp</button></div>
    <div class="sec"><h3>Goes well with</h3></div><div class="scroll">${map(PLANTS.filter(p=>p.id!==id&&p.t.some(t=>it.t.includes(t))&&p.w===it.w).slice(0,4),p=>pcard('plant',p.id))}${pcard('care',it.t.includes('flower')?'c-feed':'c-mix')}</div>`}
  else if(k==='pot'){const canSpin=Art.SPIN.includes(id);art=showPh?phImg(id,'ph big'):canSpin&&P.spin?spinBox(id):Art.plant(POT_DEMO[id],id,{cls:'main'});total=potPrice(id,P.size);sub=`${SZ(P.size).n} pot`;
    body=`<div class="pad mt pd"><h1>${esc(it.n)}</h1><p class="sci">${esc(it.m)}</p><p class="mt2">${esc(it.d)}</p></div>
    <div class="facts mt">${[['box','Material',it.m],['pin','Best for',it.p.map(x=>SPOTS[x]).join(', ')],['drop','Drainage',['basket','urli'].includes(id)?'Use as a cover':'Drainage hole + saucer'],['truck','Delivery','Bubble-wrapped, 7-day breakage cover']].map(([ic,l,v])=>`<div class="fact">${I(ic)}<div><small>${l}</small><b>${esc(v)}</b></div></div>`).join('')}</div>
    ${sizes(s=>potPrice(id,s))}${deliv}
    <div class="sec"><h3>Looks great with</h3></div><div class="scroll">${map(PLANTS.filter(p=>p.p.some(x=>it.p.includes(x))).slice(0,6),p=>pcard('plant',p.id))}</div>`}
  else if(k==='seed'){art=showPh?phImg(id,'ph big'):Art.packet(it,{cls:'main'});total=it.pr;sub='Packet of seeds';
    body=`<div class="pad mt pd"><h1>${esc(it.n)}</h1><p class="sci">${esc(it.h)} · ${esc(it.ty)} seeds</p></div>
    <div class="facts mt">${[['leaf','Germination',it.g],['cal',it.ty==='Flower'?'Flowers':'Harvest',it.hv.replace('Blooms in ','')],['drop','Sow depth',it.dep],['star','Difficulty',it.d]].map(([ic,l,v])=>`<div class="fact">${I(ic)}<div><small>${l}</small><b>${esc(v)}</b></div></div>`).join('')}</div>
    <div class="sec"><h3>When to sow</h3><span class="small muted">${it.sow.includes(MON)?'Sow now':'Not this month'}</span></div>
    <div class="cal">${map(MONTHS,(m,i)=>`<div class="${it.sow.includes(i+1)?'on':''}${i+1===MON?' now':''}"><span></span>${m[0]}</div>`)}</div>
    <p class="note mt2">Months shown for North Indian plains. In South and coastal India most seeds can be sown for longer.</p>
    <div class="sec"><h3>How to sow</h3></div><ol class="tips"><li>Fill a tray or pot with seed mix — cocopeat and compost, half and half.</li><li>Sow at ${esc(it.dep.toLowerCase())} depth, cover lightly and mist with water.</li><li>Keep in bright shade until sprouts appear in ${esc(it.g)}, then move to 4–6 hours of sun.</li><li>${it.mo==='micro'?'Snip with scissors when the first leaves open.':'Thin out or transplant when seedlings have 3–4 true leaves.'}</li></ol>
    <div class="sec"><h3>Complete your kit</h3></div><div class="scroll">${pcard('care','c-coco')}${pcard('pot','growbag')}${pcard('care','c-vermi')}</div>`}
  else{art=showPh?phImg(id,'ph big'):Art.care(it,{cls:'main'});total=it.pr;sub=it.n;body=`<div class="pad mt pd"><h1>${esc(it.n)}</h1><p class="mt2">${esc(it.d)}</p></div>${deliv}<div class="sec"><h3>Popular with</h3></div><div class="scroll">${map(['money','tulsi','gudhal','monstera'],id=>pcard('plant',id))}</div>`}
  sub+=stockNote(k,id)?` · ${stockNote(k,id)}`:'';
  return hdrSub(it.n)+`<div class="pdart ${bgc(k,id)}${showPh?' hasph':''}">${art}${tools}${k==='pot'&&Art.SPIN.includes(id)?`<div class="pdview">${hasPh?`<button class="${showPh?'on':''}" data-a="pview" data-v="ph">Photo</button>`:''}<button class="${!showPh&&!P.spin?'on':''}" data-a="pspin" data-v="0">With plant</button><button class="${!showPh&&P.spin?'on':''}" data-a="pspin" data-v="1">${I('refresh')}360°</button></div>`:hasPh?`<div class="pdview"><button class="${showPh?'on':''}" data-a="pview" data-v="ph">Photo</button><button class="${showPh?'':'on'}" data-a="pview" data-v="art">${k==='plant'?'In chosen pot':'Illustration'}</button></div>`:''}</div>`+body+`<div style="height:90px"></div><div class="buybar"><div class="tot"><b>${rs(total)}</b><small>${esc(sub)}</small></div>${avail(k,id)===0?`<button class="btn" disabled style="flex:1;opacity:.55">Out of stock</button>`:`<button class="btn ghost" data-a="addprod">Add to cart</button><button class="btn" data-a="buynow">Buy now</button>`}</div>`};

/* cart */
V.cart=()=>{if(!S.cart.length)return hdrSub('Your cart')+`<div class="empty">${Art.plant('syngonium','terracotta')}${TAG_HI('c')}<h2 class="mt2" style="color:var(--ink)">Your cart is empty</h2><p class="mt2">Start with a bestseller, or scan your space for ideas.</p><div class="row mt" style="justify-content:center"><button class="btn" data-a="tab" data-t="shop">Shop plants</button><button class="btn ghost" data-a="tab" data-t="scan">Scan my space</button></div></div>`;
  const t=totals();
  return hdrSub(`Your cart (${cartCount()})`)+map(S.cart,(l,i)=>`<div class="li"><button class="th ${bgc(l.k,l.id)}" data-a="open" data-k="${l.k}" data-id="${l.id}" aria-label="Open">${thumb(l.k,l.id,l.pot)}</button><div class="mid"><b>${esc(KIND[l.k][l.id].n)}</b><small>${esc(lineName(l))}${l.look?' · look price':''}</small><small class="b" style="color:var(--ink)">${rs(l.price*l.qty)}</small>${l.k==='plant'?(!l.pot||l.pot==='none'?`<button class="link" data-a="open" data-k="plant" data-id="${l.id}" style="font-size:13px">Add a pot</button>`:`<button class="link" data-a="rmpot" data-i="${i}" style="font-size:13px">Remove pot (plant only)</button>`):''}</div><div class="qty"><button data-a="qty" data-i="${i}" data-d="-1" aria-label="Less">${I(l.qty>1?'minus':'trash')}</button><span>${l.qty}</span><button data-a="qty" data-i="${i}" data-d="1" aria-label="More">${I('plus')}</button></div></div>`)+
  `<div class="sec"><h3>Coupon</h3>${S.coupon?`<button class="link" data-a="uncoupon">Remove</button>`:''}</div><div class="row pad"><input id="cpn" class="inp" placeholder="Try GREEN10 or FIRSTPLANT" value="${esc(S.coupon)}" style="flex:1;text-transform:uppercase"><button class="btn ghost sm" data-a="coupon">Apply</button></div>${S.coupon&&getCoupon(S.coupon)?`<p class="note mt2" style="color:var(--brand)">${esc(S.coupon)} applied: ${getCoupon(S.coupon).d}</p>`:''}
  <div class="card" style="margin:20px 16px 0"><div class="sumr"><span>Items</span><span>${rs(t.sub)}</span></div>${t.disc?`<div class="sumr" style="color:var(--brand)"><span>Discount</span><span>−${rs(t.disc)}</span></div>`:''}<div class="sumr"><span>Delivery</span><span>${t.del?rs(t.del):'Free'}</span></div><div class="sumr t"><span>Total</span><span>${rs(t.total)}</span></div>${t.del?`<p class="small muted mt2">Add ${rs(499-(t.sub-t.disc))} more for free delivery.</p>`:''}</div>
  <div class="pad mt"><button class="btn w" data-a="go" data-v="checkout">Checkout · ${rs(t.total)}</button></div><p class="note mt2" style="text-align:center">Every plant ships with a care card and a 7-day healthy-plant promise.</p>`};

AFTER.checkout=()=>{const p=$('#cPin');p.oninput=()=>{const e=eta(p.value);$('#cEta').textContent=e?e.txt:'Enter your pincode to see the delivery date'};const m=$('#cMsg');if(m)m.oninput=()=>{R.co.msg=m.value;$('#gcMsg').textContent=m.value||'Your message will appear here'};const fr=$('#cFrom');if(fr)fr.oninput=()=>{R.co.from=fr.value;$('#gcFrom').textContent='— '+(fr.value||'You')};const oc=$('#cOcc');if(oc)oc.onchange=()=>{R.co.occ=oc.value;$('#gcTop').textContent=occName(oc.value)};const dt=$('#cDate');if(dt)dt.onchange=()=>R.co.date=dt.value};

V.done=c=>{const o=S.orders.find(x=>x.id===c.oid)||S.orders[0];return hdrMain()+`<div class="empty" style="padding-top:20px">${Art.plant('genda','terracotta')}<h1 style="color:var(--ink)" class="mt2">Order placed!</h1><p class="mt2">Order ${esc(o?.id)} · ${rs(o?.total||0)}<br>${esc(o?.eta||'')}</p><p class="mt2">Your plants are in <b>My Garden</b> with watering reminders. In the real app you'd get care tips on WhatsApp.</p><p class="small mt2">Need to change something? <button class="link" data-a="raise" data-o="${esc(o?.id)}" data-t="change">Get help</button></p><div class="row mt" style="justify-content:center;flex-wrap:wrap"><button class="btn" data-a="go" data-v="order" data-id="${esc(o?.id)}">Track order</button><button class="btn ghost" data-a="go" data-v="garden">My Garden</button><button class="btn ghost" data-a="tab" data-t="home">Keep shopping</button></div></div>
  <div class="card" style="margin:0 16px"><h3>How easy was it to order?</h3><div class="chips wrap mt2" style="padding:0">${map(['Very easy','Okay','Confusing'],x=>`<button class="chip" data-a="quickfb" data-s="Checkout" data-r="${x}">${x}</button>`)}</div></div>`};

/* inspire */
const lookTotal=p=>p.items.reduce((a,[pid,pot])=>a+plantPrice(pid,'S')+potPrice(pot,'S'),0);
const allPet=p=>p.items.every(([pid])=>PL[pid].pet);
function pinCard(id){const p=PI[id];return`<div class="pin"><button data-a="pin" data-id="${id}" style="display:block;width:100%;text-align:left"><span class="ps">${Art.scene(p)}</span><div class="pt">${esc(p.t)}</div><div class="pm">${p.items.length} plants · look from ${rs(lookTotal(p)*.9)}</div></button><button class="heart${S.saved.includes(id)?' on':''}" data-a="savepin" data-id="${id}" aria-label="Save idea">${I('heart')}</button></div>`}
const IFILT=[['all','All'],['Indoor','Indoor'],['Outdoor','Balcony & terrace'],['Living room','Living room'],['Bedroom','Bedroom'],['Kitchen','Kitchen'],['Work desk','Work desk'],['small','Small spaces'],['pet','Pet-friendly'],['fest','Festive'],['vastu','Vastu'],['saved','Saved']];

V.inspire=()=>{const list=pinsFor(R.insp);return hdrTitle('Get inspired')+`<p class="note" style="margin:-4px 0 12px">Decor ideas for Indian homes, balconies and terraces. Tap any idea to shop the look or try it in your own space.</p><button class="band g" data-a="go" data-v="diy" style="width:calc(100% - 32px);text-align:left;margin-bottom:14px"><div class="bx">${Art.care(CA['c-diy-tubes'])}</div><div><h3>DIY & gift ideas</h3><p>Test-tube fridge magnets, kulhad planters, seed paper cards and more.</p><span class="link">Make something →</span></div></button><div class="chips">${map(IFILT,([k,n])=>`<button class="chip${R.insp===k?' on':''}" data-a="insp" data-f="${k}">${n}</button>`)}</div><div class="mt2"></div>${list.length?`<div class="mason">${map(list,p=>pinCard(p.id))}</div>`:`<div class="empty">${R.insp==='saved'?'Tap the heart on any idea to save it here.':'No ideas here yet.'}</div>`}`};
function openPin(id){const p=PI[id],tot=lookTotal(p);
  openSheet(`<div style="padding:0 16px"><div style="border-radius:18px;overflow:hidden">${Art.scene(p)}</div><h2 class="mt2">${esc(p.t)}</h2><div class="row mt2" style="flex-wrap:wrap;gap:6px"><span class="pill">${esc(p.io)}</span><span class="pill">${esc(p.sp)}</span>${allPet(p)?'<span class="pill">Pet-friendly</span>':''}</div><h3 class="mt">Why it works</h3><ul class="tips" style="padding:0 0 0 18px">${map(p.tips,t=>`<li>${esc(t)}</li>`)}</ul><h3 class="mt">Shop this look</h3></div>

/* ---------- scan my space ---------- */
const SAMPLES=[{pin:'jungle',n:'Living room',light:3,loc:'indoor',spot:'floor',tone:'warm'},{pin:'bedroom',n:'Bedroom',light:2,loc:'indoor',spot:'table',tone:'white'},{pin:'herbbalcony',n:'Balcony',light:4,loc:'balcony',spot:'railing',tone:'colour'},{pin:'desk',n:'Work desk',light:2,loc:'office',spot:'table',tone:'white'}];
const LOCS=[['indoor','Indoor room'],['balcony','Balcony'],['terrace','Terrace or garden'],['office','Office']];
const LOC_SPOTS={indoor:['floor','table','hanging','wall','window'],office:['floor','table','hanging','wall','window'],balcony:['floor','railing','hanging','wall','window'],terrace:['ground','railing','wall']};
const LIGHT_HELP=['','Far from windows, no direct light','Near a window, no direct sun','Right beside a bright window','4+ hours of direct sun'];
const SPOT_POTS={floor:['basket','white','brass','teal','wooden','terracotta'],floorOut:['terracotta','wooden','brass','white'],table:['bluepottery','concrete','warli','white','teal','selfwater','terracotta'],hanging:['macrame'],wall:['wall'],window:['terracotta','selfwater','warli','concrete'],railing:['railing'],ground:['terracotta','growbag','wooden']};
const TONE_POTS={white:['terracotta','brass','basket','warli','teal'],warm:['white','teal','concrete','bluepottery'],dark:['white','brass','bluepottery','terracotta'],colour:['white','terracotta','concrete','basket']};
const TONE_TXT={white:'Light, neutral walls',warm:'Warm beige walls',dark:'Darker walls',colour:'Coloured surroundings'};
const SPOT_POS={floor:{y:95,w:34},ground:{y:95,w:34},table:{y:74,w:22},hanging:{y:3,w:24},wall:{y:58,w:24},window:{y:64,w:20},railing:{y:60,w:46}};
const LIGHT_TIP=['','Even low-light plants need some daylight — keep it within 2–3 m of your brightest window.','A spot 1–2 m from a window that gets no direct sun is ideal.','Right next to the window, but out of harsh afternoon rays.','Give it 4–6 hours of direct sun and water more often in May–June.'];
const SPOT_TIP={floor:'Use a heavy pot so tall plants don’t tip, and a saucer to protect tiles.',table:'Keep a saucer under the pot and rotate it weekly so it grows evenly.',hanging:'Hang from a ceiling hook or curtain rod; take it to the sink to water.',wall:'Mount at eye level and keep it away from AC vents.',window:'Rotate the pot every week so it doesn’t lean towards the glass.',railing:'Secure the hooks tightly and face the planter towards the sun.',ground:'Use clay pots or grow bags with good drainage, and mulch in summer.'};
const spotPots=(sc)=>SPOT_POTS[sc.spot==='floor'&&sc.loc!=='indoor'&&sc.loc!=='office'?'floorOut':sc.spot]||SPOT_POTS.table;
function fitsSpot(p,sc){const s=sc.spot;return p.p.includes(s)||(s==='floor'&&sc.loc!=='indoor'&&sc.loc!=='office'&&p.p.includes('ground'))||(s==='ground'&&p.p.includes('floor'))||(s==='window'&&p.p.includes('table')&&p.L[1]>=3)}
function suggestPot(p,sc){if(p.f==='lotus')return'urli';const al=spotPots(sc);const pref=sc.loc==='terrace'?['terracotta','growbag','wooden']:(TONE_POTS[sc.tone]||[]);return pref.find(x=>al.includes(x))||(al.includes(p.dp)?p.dp:al[0])}
function recommend(sc){const clim=CITIES[sc.city]||'mild',city=sc.city==='Other'?'your city':sc.city,out=[];
  for(const p of PLANTS){let s=72;const why=[],warn=[];
    if((sc.loc==='indoor'||sc.loc==='office')&&p.w==='out')continue;
    if(sc.loc==='terrace'&&p.w==='in')continue;
    if(sc.loc==='balcony'&&p.w==='in'){s-=sc.light>=4?14:2;if(sc.light>=4)warn.push('Needs shade from afternoon sun')}
    const L=sc.light;if(L<p.L[0]){s-=22*(p.L[0]-L);warn.push(`Prefers more light`)}else if(L>p.L[1]){s-=22*(L-p.L[1]);warn.push('Too much sun here')}else{s+=12;why.push(L<=1?'Copes with low light':L>=4?'Loves full sun':`Happy in ${LIGHT[L].toLowerCase()}`)}
    const fit=fitsSpot(p,sc);if(fit){s+=8;why.push(`Suits ${SPOTS[sc.spot].toLowerCase()}`)}else{s-=30;warn.unshift(`Best in: ${p.p.slice(0,2).map(x=>SPOTS[x]).join(', ')}`)}
    if(sc.pets){if(p.pet){s+=8;why.push('Safe around cats and dogs')}else continue}
    if(sc.kids&&p.f==='cactus')s-=20;
    if(sc.care==='low'){if(p.wt==='Low'){s+=8;why.push('Survives missed waterings')}if(p.d==='Expert')s-=25;if(p.wt==='High')s-=12}
    if(sc.care==='high'&&(p.d==='Expert'||p.t.includes('big'))){s+=4;why.push('A rewarding plant to master')}
    if(sc.care==='some'&&p.d==='Easy')s+=3;
    if(p.cl==='humid'){if(clim==='humid'){s+=6;why.push(`Loves ${city}'s humidity`)}else if(clim==='hot-dry'){s-=8;warn.push('Mist it in dry months')}}
    if(p.cl==='dry'){if(clim==='hot-dry'||clim==='dry'){s+=6;why.push(`Handles ${city}'s dry heat`)}else if(clim==='humid'){s-=6;warn.push('Water less in the monsoon')}}
    if(sc.loc==='office'&&p.t.includes('air')){s+=4;why.push('Air-purifying for work spaces')}
    if(sc.vz){const v=vastuOf(p),zn=DIRS[sc.vz].n.toLowerCase();if(v.out&&sc.loc!=='terrace'){s-=30;warn.unshift('Vastu: keep it outside the home')}else if((sc.vz==='S'&&p.id==='tulsi')||(sc.vz==='NE'&&p.id==='money')){s-=25;warn.unshift(`Vastu: not for the ${zn}`)}else if(v.d.includes(sc.vz)&&v.specific){s+=10;why.unshift(`Vastu: suits the ${zn}`)}else if(v.d.includes(sc.vz)){s+=4;why.push(`Vastu: fine in the ${zn}`)}}
    out.push({p,s:Math.max(35,Math.min(98,Math.round(s))),why,warn,fit})}
  out.sort((a,b)=>b.s-a.s);let top=out.filter(r=>r.s>=55);if(top.length<3)top=out.slice(0,3);return top.slice(0,6).map(r=>({...r,pot:suggestPot(r.p,sc)}))}
function analyzeImg(src){try{const c=document.createElement('canvas');c.width=48;c.height=48;const x=c.getContext('2d');x.drawImage(src,0,0,48,48);const d=x.getImageData(0,0,48,48).data;
  let sum=0,br=0,sky=0,gr=0,n=0,tn=0;const top=[0,0,0];
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],y=.2126*r+.7152*g+.0722*b,row=Math.floor(i/192);sum+=y;n++;if(y>235)br++;if(row<16&&b>r+15&&b>=g&&b>140)sky++;if(g>r+12&&g>b+8&&g>70)gr++;if(row<20&&y<235){top[0]+=r;top[1]+=g;top[2]+=b;tn++}}
  const lum=sum/n,bright=br/n,skyR=sky/768;let light=lum<70?1:lum<120?2:3;if(bright>.08&&light<3)light++;if(skyR>.18&&bright>.2)light=4;
  const w=tn?top.map(v=>v/tn):[200,200,200],wl=.2126*w[0]+.7152*w[1]+.0722*w[2],spread=Math.max(...w)-Math.min(...w);
  const tone=wl<90?'dark':spread<22&&wl>165?'white':w[0]>w[2]+18?'warm':'colour';
  return{ok:true,lum:Math.round(lum),bright,sky:skyR,green:gr/n,tone,light,outdoor:skyR>.18}}catch(e){return{ok:false,light:2,tone:'white',outdoor:false,green:0}}}
function startScan(photo,st,preset={}){const loc=preset.loc||(st.outdoor?'balcony':'indoor');
  R.scan={step:'analyze',photo,st,light:preset.light||st.light,loc,tone:preset.tone||st.tone,spot:preset.spot||LOC_SPOTS[loc][0],pets:R.scan.pets||false,kids:R.scan.kids||false,care:R.scan.care||'some',city:S.city,items:[],sel:0,preset:R.scan.preset,sample:preset.n||null,token:Math.random()};
  if(cur().v!=='scan')tab('scan');else render(true)}
function loadPhoto(file){if(!file)return;const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let data=url;try{data=c.toDataURL('image/jpeg',.86)}catch(e){}startScan(data,analyzeImg(c))};
  img.onerror=()=>toast('Could not open that photo — try a JPG or PNG');img.src=url}
function useSample(i){const s=SAMPLES[i],p=PI[s.pin],H=Math.round(900*p.r);const svgS=Art.scene(p,{plants:false,w:900,h:H});startScan('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgS),{ok:false,light:s.light,tone:s.tone,outdoor:s.loc!=='indoor'},s)}
async function startLive(){try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});R.stream=st;R.scan.step='live';render(true)}catch(e){toast('Live camera isn’t available here — use Take a photo instead')}}
function stopLive(){if(R.stream){R.stream.getTracks().forEach(t=>t.stop());R.stream=null}}
function capture(){const v=$('#live');if(!v||!v.videoWidth)return;const k=Math.min(1,1200/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);stopLive();let d;try{d=c.toDataURL('image/jpeg',.86)}catch(e){toast('Could not capture — try Take a photo');return}startScan(d,analyzeImg(c))}
function placeItems(list){const sc=R.scan;sc.items=list.map(([pid,pot,spot],i)=>{const pos=SPOT_POS[spot]||SPOT_POS.floor,n=list.length;return{pid,pot,x:n===1?50:Math.round(16+68*i/(n-1)),y:pos.y,w:pos.w}});sc.sel=0;sc.step='preview'}
const spotOf=pot=>({macrame:'hanging',wall:'wall',railing:'railing'})[pot]||null;

    <div class="card" style="margin:20px 16px 0"><h3>How the scan works in this preview</h3><p class="small muted mt2">The app estimates light from your photo’s brightness and colours, and combines it with your answers. The launch version would add an AI vision model to recognise windows, floor space and furniture automatically. Photos stay on this phone.</p></div>`}

  case'questions':{const st=sc.st;return hdr('A few quick questions')+`<div style="display:flex;gap:12px;padding:0 16px;align-items:center"><div style="width:96px;border-radius:14px;overflow:hidden;flex:none"><img src="${sc.photo}" alt="" style="width:100%;display:block"></div><div><h3>What we picked up</h3><div class="row mt2" style="flex-wrap:wrap;gap:6px"><span class="pill">${I('sun')}${LIGHT[sc.light]}${sc.sample?'':' (estimated)'}</span><span class="pill">${TONE_TXT[sc.tone]}</span>${st.outdoor?'<span class="pill">Looks like outdoors</span>':''}${st.green>.15?'<span class="pill">Greenery already here</span>':''}</div></div></div>
    <div class="sec"><h3>How much light does this spot get?</h3></div>${sc.sample?'':`<p class="note" style="margin:-4px 0 10px">We guessed from your photo, but phone cameras brighten everything — please check.</p>`}<div class="pad" style="display:grid;gap:8px">${map([1,2,3,4],l=>`<button class="opt${sc.light===l?' on':''}" data-a="sq" data-q="light" data-v="${l}">${I('sun')}<span><b>${LIGHT[l]}</b><br><span class="small muted">${LIGHT_HELP[l]}</span></span></button>`)}</div>
    <div class="sec"><h3>Where is this?</h3></div><div class="chips wrap">${map(LOCS,([k,n])=>`<button class="chip${sc.loc===k?' on':''}" data-a="sq" data-q="loc" data-v="${k}">${n}</button>`)}</div>
    <div class="sec"><h3>Where will the plant go?</h3></div><div class="chips wrap">${map(LOC_SPOTS[sc.loc],k=>`<button class="chip${sc.spot===k?' on':''}" data-a="sq" data-q="spot" data-v="${k}">${SPOTS[k]}</button>`)}</div>
    <div class="sec"><h3>Following Vastu? Which zone of your home is this?</h3></div><div class="chips wrap"><button class="chip${!sc.vz?' on':''}" data-a="sq" data-q="vz" data-v="">Skip</button>${map(['N','NE','E','SE','S','SW','W','NW'],d=>`<button class="chip${sc.vz===d?' on':''}" data-a="sq" data-q="vz" data-v="${d}">${DIRS[d].n}</button>`)}</div><div class="pad mt2"><button class="link" data-a="vdetect" data-scan="1">${I('pin')} Detect with phone compass</button></div>
    <div class="sec"><h3>Anyone curious at home?</h3></div><div class="chips wrap"><button class="chip${sc.pets?' on':''}" data-a="sq" data-q="pets">Pets</button><button class="chip${sc.kids?' on':''}" data-a="sq" data-q="kids">Small kids</button></div>

  case'results':{const recs=sc.recs;return hdr('Best for this spot')+`<div class="row pad" style="flex-wrap:wrap;gap:6px"><span class="pill">${LIGHT[sc.light]}</span><span class="pill">${LOCS.find(l=>l[0]===sc.loc)[1]}</span><span class="pill">${SPOTS[sc.spot]}</span><span class="pill">${esc(sc.city)}</span>${sc.pets?'<span class="pill">Pets</span>':''}${sc.vz?`<span class="pill">Vastu: ${DIRS[sc.vz].n}</span>`:''}</div>

AFTER.scan=()=>{const sc=R.scan;
  if(sc.step==='live'){const v=$('#live');if(v&&R.stream){v.srcObject=R.stream;v.play().catch(()=>{})}}
  if(sc.step==='analyze'){const tk=sc.token;setTimeout(()=>{if(R.scan.token!==tk||R.scan.step!=='analyze')return;const pre=R.scan.preset;
    if(pre){R.scan.preset=null;if(pre.pid){const p=PL[pre.pid];const sp=spotOf(pre.pot)||(p.p.includes(sc.spot)?sc.spot:LOC_SPOTS[sc.loc].find(s=>p.p.includes(s))||p.p[0]);sc.spot=sp;sc.recs=recommend(sc);placeItems([[pre.pid,pre.pot,sp]])}else{const pin=PI[pre.pin];sc.recs=recommend(sc);placeItems(pin.items.map(([pid,pot,x,yf])=>[pid,pot,spotOf(pot)||(yf<.9?'table':'floor')]))}}
    else R.scan.step='questions';render(true)},1600)}
  if(sc.step==='questions'){$('#city').onchange=e=>{sc.city=e.target.value;S.city=sc.city;save()}}
  if(sc.step==='preview')bindPreview()};
function bindPreview(){const pv=$('#pv');if(!pv)return;let drag=null;
  pv.onpointerdown=e=>{const el=e.target.closest('.pvi');if(!el)return;const i=+el.dataset.i;const sc=R.scan;if(sc.sel!==i){sc.sel=i;pv.querySelectorAll('.pvi').forEach(n=>n.classList.toggle('sel',+n.dataset.i===i));$('#pvc').innerHTML=pvControls();bindSize()}
    const r=pv.getBoundingClientRect(),it=sc.items[i];drag={el,it,dx:e.clientX-(r.left+it.x/100*r.width),dy:e.clientY-(r.top+it.y/100*r.height),r};el.setPointerCapture(e.pointerId);e.preventDefault()};
  pv.onpointermove=e=>{if(!drag)return;const{r,it,el}=drag;it.x=Math.max(0,Math.min(100,(e.clientX-drag.dx-r.left)/r.width*100));it.y=Math.max(0,Math.min(100,(e.clientY-drag.dy-r.top)/r.height*100));el.style.left=it.x+'%';el.style.top=it.y+'%'};
  pv.onpointerup=pv.onpointercancel=()=>{drag=null};bindSize()}
function bindSize(){const s=$('#pvsize');if(!s)return;s.oninput=()=>{const sc=R.scan,it=sc.items[sc.sel];if(!it)return;it.w=+s.value;const el=document.querySelector(`.pvi[data-i="${sc.sel}"]`);if(el)el.style.width=it.w+'%'}}
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
async function composite(){const sc=R.scan,img=await loadImg(sc.photo);const W=img.naturalWidth||900,H=img.naturalHeight||900;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
  for(const it of sc.items){const w=it.w/100*W,h=w*1.3,a=(Art.ANCHOR[it.pot]??252)/260;const pi=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(Art.plant(it.pid,it.pot,{w:Math.round(w),h:Math.round(h),rail:false})));x.drawImage(pi,it.x/100*W-w/2,it.y/100*H-a*h,w,h)}
  const fs=Math.max(14,Math.round(W*.028));x.fillStyle='rgba(20,33,26,.72)';x.fillRect(0,H-fs*2,W,fs*2);x.fillStyle='#fff';x.font=`700 ${fs}px sans-serif`;x.fillText(`${BN} · ${sc.items.map(i=>PL[i.pid].n.split(' (')[0]).join(', ')}`,fs*.6,H-fs*.65);
  return c.toDataURL('image/jpeg',.9)}

  <button class="pcopt" data-a="potpick" data-w="1"><span class="art">${groupArt(list)}</span><span class="tx"><b>${one?`With ${esc(PO[oa].n)}`:'With matching pots'}</b><small>Planted in the pot, ready to place</small><em>${price(p1)}</em></span></button></div>

let swayObs=null;const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function armSway(root,fresh){if(fresh&&swayObs)swayObs.disconnect();const svgs=[...root.querySelectorAll('svg')].filter(s=>!(s.parentElement&&s.parentElement.closest('svg'))&&s.querySelector('animateTransform'));
  if(!S.anim||REDUCED){svgs.forEach(s=>{try{s.pauseAnimations()}catch(e){}});return}
  if(!swayObs&&'IntersectionObserver' in window)swayObs=new IntersectionObserver(es=>es.forEach(en=>{try{en.isIntersecting?en.target.unpauseAnimations():en.target.pauseAnimations()}catch(e){}}),{rootMargin:'80px'});
  svgs.forEach(s=>{if(swayObs)swayObs.observe(s)})}

  (S.garden.length?map(S.garden,(g,i)=>{const d=gDue(g),p=PL[g.pid];return`<div class="li"><button class="th ${bgc('plant',g.pid)}" data-a="open" data-k="plant" data-id="${g.pid}">${Art.plant(g.pid,g.pot&&g.pot!=='none'?g.pot:p.dp)}</button><div class="mid"><b>${esc(p.n)}</b><small>Water every ${gDays(g)} days · ${esc(LIGHT[p.L[1]].toLowerCase())}</small><span class="pill${d<=0?' w':''} mt2" style="margin-top:4px">${I('drop')}${d<0?`Overdue by ${-d} day${d<-1?'s':''}`:d===0?'Water today':`Next in ${d} day${d>1?'s':''}`}</span></div><div style="display:grid;gap:6px"><button class="btn sm" data-a="water" data-i="${i}">Watered</button><button class="link" data-a="grm" data-i="${i}" style="font-size:12px">Remove</button></div></div>`}):`<div class="empty">${Art.plant('money','terracotta')}<p class="mt2">Plants you buy appear here automatically. Already have plants at home? Add them to get reminders.</p></div>`)+
  `<div class="pad mt"><button class="btn ghost w" data-a="gadd">${I('plus')}Add a plant I already own</button></div>`;
V.doctor=()=>hdrSub('Plant Doctor')+`<p class="note">What's going on with your plant? Pick the closest symptom.</p><div class="grid mt2">${map(DOCTOR,d=>`<button class="tile" data-a="go" data-v="doc" data-id="${d.id}">${I('doc')}<b>${esc(d.t)}</b><small>${esc(d.c[0])}</small></button>`)}</div><div class="card" style="margin:20px 16px 0"><h3>Still not sure?</h3><p class="small muted mt2">Send a photo to our plant expert on WhatsApp. We reply ${esc(BRAND.supportReply)}.</p><button class="btn wa sm mt2" data-a="raise" data-t="unwell">${I('chat')}Ask a plant expert</button></div>`;
V.doc=c=>{const d=DOCTOR.find(x=>x.id===c.id);return hdrSub(d.t)+`<div class="sec" style="margin-top:12px"><h3>Likely causes</h3></div><ul class="tips">${map(d.c,x=>`<li>${esc(x)}</li>`)}</ul><div class="sec"><h3>What to do</h3></div><ol class="tips">${map(d.fx,x=>`<li>${esc(x)}</li>`)}</ol><div class="sec"><h3>Helpful products</h3></div><div class="scroll">${map(d.pr,id=>pcard('care',id))}${pcard('care','c-tools')}</div><div class="card" style="margin:20px 16px 0"><h3>Not getting better?</h3><p class="small muted mt2">Send us a photo and we’ll tell you what to do.</p><button class="btn wa sm mt2" data-a="raise" data-t="unwell">${I('chat')}Ask a plant expert</button></div>`};
V.season=c=>{const sid=c.s||SEASON.id,se=SEASONS.find(s=>s.id===sid);const sow=SEEDS.filter(s=>s.sow.some(m=>sid===SEASON.id?m===MON:se.m.includes(m)));

V.services=()=>hdrSub('Garden services')+`<p class="note">Sample services and prices — tell us in your feedback which ones you'd pay for.</p><div class="mt2"></div>`+map(SERVICES,s=>`<div class="card" style="margin:0 16px 12px"><div class="row"><h3 style="flex:1">${esc(s.t)}</h3><span class="pill">${esc(s.p)}</span></div><p class="small muted mt2">${esc(s.d)}</p><button class="btn ghost sm mt2" data-a="svc" data-id="${s.id}">Request a callback</button></div>`);
function searchHTML(q){q=(q||'').trim().toLowerCase();if(!q)return`<p class="note">Try “tulsi”, “low light”, “hanging”, “bhindi” or “gift”.</p><div class="chips wrap mt2">${map(['Money plant','Tulsi','Low light','Pet-friendly','Railing planter','Palak seeds'],x=>`<button class="chip" data-a="sugg" data-q="${x}">${x}</button>`)}</div>`;
  const hit=(o,extra='')=>(o.n+' '+(o.h||'')+' '+(o.sci||'')+' '+(o.al||'')+' '+(o.m||'')+' '+(o.ty||'')+' '+extra).toLowerCase().includes(q.replace(/ seeds?$/,''));
  const pl=PLANTS.filter(p=>hit(p,p.t.map(t=>TAGS[t]).join(' ')+(isVastu(p)?' vastu':'')+(p.pet?' pet-friendly pet friendly':'')+' '+p.p.map(x=>SPOTS[x]).join(' '))),po=POTS.filter(p=>hit(p,p.p.map(x=>SPOTS[x]).join(' '))),se=SEEDS.filter(p=>hit(p,'seeds')),ca=CARE.filter(p=>hit(p,p.d));
  const grp=(t,k,a)=>a.length?`<div class="sec"><h3>${t} (${a.length})</h3></div><div class="scroll">${map(a,x=>pcard(k,x.id))}</div>`:'';
  const kits=KITS.filter(k=>(k.n+' '+k.d+' kit').toLowerCase().includes(q));
  return((kits.length?`<div class="sec"><h3>Kits (${kits.length})</h3></div><div class="scroll">${map(kits,kitCard)}</div>`:'')+grp('Plants','plant',pl)+grp('Pots','pot',po)+grp('Seeds','seed',se)+grp('Care & tools','care',ca))||`<div class="empty">No results for “${esc(q)}”. ${/gift/.test(q)?'Try Me → Gift a plant.':''}</div>`}
V.search=c=>`<header class="hdr"><button class="ib" data-a="back" aria-label="Back">${I('back')}</button><label class="search" style="margin:0;flex:1">${I('search')}<input id="sq" type="search" placeholder="Search plants, pots, seeds" value="${esc(c.q||'')}" aria-label="Search"></label></header><div id="sres" class="mt2">${searchHTML(c.q)}</div>`;
AFTER.search=c=>{const i=$('#sq');i.focus();i.oninput=()=>{c.q=i.value;$('#sres').innerHTML=searchHTML(i.value)}};

/* ---------- customer support ---------- */

const supWA=()=>(BRAND.supportWhatsApp||BRAND.feedbackWhatsApp||'').replace(/\D/g,'');
const waLink=t=>`https://wa.me/${supWA()}?text=${encodeURIComponent(t)}`;
const fmtD=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const fmtDT=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const TK_ST={open:['Open','w'],resolved:['Resolved','']};
const helloMsg=()=>`Hi ${BN} team, I have a question.${S.tester?`\n\nName: ${S.tester}`:''}`;
function tkMsg(t){const tp=TOPIC[t.t],o=t.o&&S.orders.find(x=>x.id===t.o);const L=[`Hi ${BN} team, I need help.`,'',`Request: ${t.id}`,`Topic: ${tp.n}`];
  if(t.o){if(o)L.push(`Order: ${o.id} · placed ${fmtD(o.at)} · ${rs(o.total)}`,`Order status: ${TRACK[trackStep(o)][0]}`);else L.push(`Order: ${t.o}`)}
